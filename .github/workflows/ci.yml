# Controlli automatici a ogni push e pull request: se qualcosa si rompe, lo vedo subito.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checker:
    name: Checker (Bash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Shellcheck
        run: shellcheck checker/check.sh checker/test_check.sh
      - name: Test
        run: ./checker/test_check.sh

  api:
    name: API (Python + SQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: polso_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-retries 20
    defaults:
      run:
        working-directory: api
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/polso_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test (con PostgreSQL vero)
        run: pytest -q
      - name: Dati di esempio caricabili
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f ../db/migrations/001_schema.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f ../db/seed.sql

  web:
    name: Dashboard (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  docker:
    name: Immagini Docker
    runs-on: ubuntu-latest
    needs: [checker, api, web]
    steps:
      - uses: actions/checkout@v5
      - name: Build di tutte le immagini
        env:
          POSTGRES_PASSWORD: ci
          POLSO_INGEST_TOKEN: ci
        run: |
          cp checker/sites.example.txt checker/sites.txt
          docker compose build
