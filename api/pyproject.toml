[project]
name = "polso-api"
version = "1.0.0"
requires-python = "~=3.12.0"
# le stesse versioni di requirements.txt (usato da Docker e dalla CI)
dependencies = [
    "fastapi==0.118.0",
    "psycopg[binary]==3.2.10",
    "pydantic==2.11.9",
    "uvicorn==0.37.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]  # assert ammessi (test e controlli interni)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # token finti nei test

[tool.pytest.ini_options]
testpaths = ["tests"]

# Vercel: dove si trova l'app FastAPI
[tool.vercel]
entrypoint = "app.main:app"
