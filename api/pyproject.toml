[project]
name = "polso-api"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]  # assert ammessi (test e controlli interni)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # token finti nei test

[tool.pytest.ini_options]
testpaths = ["tests"]

# Vercel: dove si trova l'app FastAPI
[tool.vercel]
entrypoint = "app.main:app"
